<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>tea</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0a0a;
    color: #f0ecff;
    font-family: 'DM Sans', sans-serif;
    font-weight: 300;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    overflow-x: hidden;
  }

  .glow {
    position: fixed;
    width: 600px; height: 600px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(120,80,200,0.13) 0%, transparent 70%);
    top: -150px; left: 50%; transform: translateX(-50%);
    pointer-events: none; z-index: 0;
  }

  .glow2 {
    position: fixed;
    width: 400px; height: 400px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(90,50,180,0.08) 0%, transparent 70%);
    bottom: -100px; right: -100px;
    pointer-events: none; z-index: 0;
  }

  .container {
    position: relative; z-index: 1;
    max-width: 400px; width: 100%;
    display: flex; flex-direction: column; align-items: center;
  }

  .sticker-top {
    font-size: 30px;
    margin-bottom: 10px;
    animation: float 4s ease-in-out infinite;
    filter: drop-shadow(0 0 10px rgba(160,120,255,0.5));
  }

  @keyframes float {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(-7px); }
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .container > * {
    animation: fadeIn 0.7s ease forwards;
    opacity: 0;
  }

  .sticker-top { animation-delay: 0.1s; }
  .avatar-ring { animation-delay: 0.2s; }
  .name { animation-delay: 0.3s; }
  .tagline { animation-delay: 0.35s; }
  .divider { animation-delay: 0.4s; }
  .bio-card { animation-delay: 0.45s; }
  .links-title { animation-delay: 0.5s; }
  .links { animation-delay: 0.55s; }
  .footer { animation-delay: 0.6s; }

  .avatar-ring {
    width: 92px; height: 92px;
    border-radius: 50%;
    background: linear-gradient(135deg, #7c4dcc, #b388ff, #311b92);
    padding: 2px;
    margin-bottom: 18px;
  }

  .avatar-inner {
    width: 100%; height: 100%;
    border-radius: 50%;
    background: #0f0d1a;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Cormorant Garamond', serif;
    font-size: 30px;
    font-weight: 300;
    font-style: italic;
    color: #c4a8ff;
    letter-spacing: 1px;
  }

  .name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 42px;
    font-weight: 300;
    letter-spacing: 7px;
    text-transform: lowercase;
    color: #e8deff;
    margin-bottom: 6px;
  }

  .tagline {
    font-size: 11.5px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #7a6a99;
    margin-bottom: 28px;
  }

  .divider {
    width: 40px; height: 1px;
    background: linear-gradient(to right, transparent, #6b4fa0, transparent);
    margin-bottom: 26px;
  }

  .bio-card {
    background: rgba(255,255,255,0.03);
    border: 0.5px solid rgba(160,120,255,0.15);
    border-radius: 18px;
    padding: 22px 26px;
    width: 100%;
    margin-bottom: 26px;
    position: relative;
    overflow: hidden;
  }

  .bio-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(to right, transparent, rgba(160,120,255,0.35), transparent);
  }

  .bio-stickers {
    display: flex; gap: 8px; margin-bottom: 12px;
    font-size: 17px;
  }

  .bio-text {
    font-size: 13.5px;
    line-height: 1.9;
    color: #b0a0cc;
  }

  .bio-highlight {
    color: #c4a8ff;
  }

  .links-title {
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #5a4a70;
    margin-bottom: 14px;
    align-self: flex-start;
  }

  .links {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .link-btn {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(255,255,255,0.03);
    border: 0.5px solid rgba(160,120,255,0.15);
    border-radius: 13px;
    padding: 14px 20px;
    color: #d0beff;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 300;
    letter-spacing: 0.5px;
    text-decoration: none;
    cursor: pointer;
    transition: all 0.25s ease;
  }

  .link-btn:hover {
    background: rgba(120,80,200,0.13);
    border-color: rgba(160,120,255,0.35);
    color: #e8deff;
    transform: translateY(-2px);
  }

  .link-btn .left { display: flex; align-items: center; gap: 11px; }
  .link-btn .icon { font-size: 16px; }
  .link-btn .arrow { font-size: 12px; opacity: 0.35; }

  .sticker-float {
    position: fixed;
    pointer-events: none;
    user-select: none;
  }

  .sf1 { top: 8%; right: 6%; font-size: 24px; animation: float 5s ease-in-out infinite; animation-delay: 0.5s; opacity: 0.5; }
  .sf2 { bottom: 12%; left: 5%; font-size: 20px; animation: float 6s ease-in-out infinite; animation-delay: 1.5s; opacity: 0.45; }
  .sf3 { top: 40%; right: 4%; font-size: 15px; animation: float 4.5s ease-in-out infinite; animation-delay: 0.8s; opacity: 0.4; }
  .sf4 { top: 65%; left: 4%; font-size: 18px; animation: float 5.5s ease-in-out infinite; animation-delay: 2s; opacity: 0.35; }
  .sf5 { top: 25%; left: 3%; font-size: 22px; animation: float 5s ease-in-out infinite; animation-delay: 1s; opacity: 0.45; }
  .sf6 { bottom: 25%; right: 5%; font-size: 20px; animation: float 6.5s ease-in-out infinite; animation-delay: 0.3s; opacity: 0.4; }
  .sf7 { top: 50%; left: 6%; font-size: 16px; animation: float 4s ease-in-out infinite; animation-delay: 2.5s; opacity: 0.35; }
  .sf8 { bottom: 5%; right: 8%; font-size: 22px; animation: float 5s ease-in-out infinite; animation-delay: 1.2s; opacity: 0.45; }

  .footer {
    margin-top: 30px;
    font-size: 11px;
    letter-spacing: 2px;
    color: #3d3050;
    text-transform: uppercase;
  }
</style>
</head>
<body>

<div class="glow"></div>
<div class="glow2"></div>

<div class="sticker-float sf1">🌙</div>
<div class="sticker-float sf2">🫧</div>
<div class="sticker-float sf3">✦</div>
<div class="sticker-float sf4">🪻</div>
<div class="sticker-float sf5">🐻</div>
<div class="sticker-float sf6">🐱</div>
<div class="sticker-float sf7">🐈‍⬛</div>
<div class="sticker-float sf8">🧸</div>

<div class="container">

  <div class="sticker-top">🐻🪷🐱</div>

  <div class="avatar-ring">
    <div class="avatar-inner">t</div>
  </div>

  <h1 class="name">tea</h1>
  <p class="tagline">she / her &nbsp;·&nbsp; 🌍</p>

  <div class="divider"></div>

  <div class="bio-card">
    <div class="bio-stickers">🐻 🖤 🐱 🧸 🐈‍⬛</div>
  </div>

  <p class="links-title">find me here</p>

  <div class="links">
    <a class="link-btn" href="https://www.instagram.com/teachkag/" target="_blank">
      <span class="left"><span class="icon">📸</span> instagram</span>
      <span class="arrow">↗</span>
    </a>
    <a class="link-btn" href="mailto:teagogoli12@gmail.com">
      <span class="left"><span class="icon">💌</span> teagogoli12@gmail.com</span>
      <span class="arrow">↗</span>
    </a>
    <a class="link-btn" href="https://www.tiktok.com/@xvjstt" target="_blank">
      <span class="left"><span class="icon">🎶</span> tiktok</span>
      <span class="arrow">↗</span>
    </a>

  </div>

  <p class="footer">made with love 🖤</p>

</div>
</body>
</html>
